# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  schedule:
    - cron: '30 13 * * 4'  # 13:30 UTC = 7:30 AM MT (DST), every Thursday

name: update
run-name: Update the USDM County Aggregation Archive

permissions: write-all

defaults:
  run:
    shell: bash -l {0}

jobs:
  update-usdm-counties:
    name: update-usdm-counties-reported
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:

      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: run
        run: |
          Rscript usdm-counties-reported.R
  
      - name: commit
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit --allow-empty -m 'weekly update'
          git push
          
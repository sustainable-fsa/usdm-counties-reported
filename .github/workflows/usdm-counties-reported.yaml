# Canonical archive-update workflow (sustainable-fsa S3 migration).
name: update
run-name: Update the usdm-counties-reported archive → S3

on:
  schedule:
    # fallback only; normally dispatched from sustainable-fsa/usdm
    - cron: '20 20 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Run even when the freshness precheck sees nothing new upstream.
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['**.R', '.github/workflows/**']

permissions:
  id-token: write
  contents: write  # commit-back of rendered README

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Decide whether there is anything to do before the macOS runner and the
  # geospatial toolchain spin up. Unlike the sibling county archives, this one
  # reads NDMC DataServices directly rather than a sustainable-fsa archive, so
  # readiness is "the API returns rows for the week". One state is enough — NDMC
  # publishes the whole week at once. The per-week gate in the R script remains
  # the local authority once `update` starts.
  #
  # The gate fails OPEN: it skips only on a definite answer (HTTP 200 with no
  # rows, or the week already present here). A probe that itself fails leaves
  # `proceed` true, so a network blip costs a redundant run rather than silently
  # stalling the archive.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          NDMC: https://usdmdataservices.unl.edu/api/CountyStatistics/GetDroughtSeverityStatisticsByAreaPercent
          MINE: https://data.sustainable-fsa.com/usdm-counties-reported/data/usdm
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # Code changes and an explicit force always run; only the scheduled
          # and dispatched cascade paths are gated.
          if [ "$EVENT" = push ] || [ "$FORCE" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest USDM Tuesday at least two days old — mirrors usdm_get_dates().
          wk=
          for i in $(seq 2 15); do
            d=$(date -u -d "$i days ago" +%F)
            if [ "$(date -u -d "$d" +%u)" = 2 ]; then wk="$d"; break; fi
          done

          # NDMC wants M/D/YYYY, matching the script's lubridate::stamp_date().
          body=$(mktemp)
          http=$(curl -sS -o "$body" -w '%{http_code}' --max-time 45 --retry 3 \
                   -H 'Accept: text/csv' \
                   "$NDMC?aoi=MT&startdate=$(date -u -d "$wk" '+%-m/%-d/%Y')&enddate=$(date -u -d "$wk" '+%-m/%-d/%Y')&statisticsType=2" \
                   2>/dev/null | tail -c 3)
          rows=$(wc -l < "$body" | tr -d '[:space:]')

          mine=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 \
                   -I "$MINE/USDM_$wk.parquet" 2>/dev/null | tail -c 3)
          echo "week=$wk ndmc_http=$http ndmc_rows=$rows mine=$mine"

          # A skip on a dispatched run is worth flagging: whatever dispatched us
          # should already have published the week.
          lvl=notice
          if [ "$EVENT" = workflow_dispatch ]; then lvl=warning; fi

          if [ "$http" = 200 ] && [ "$rows" -le 1 ]; then
            echo "::${lvl}::NDMC DataServices has no rows for $wk yet; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$http" = 200 ] && [ "$mine" = 200 ]; then
            echo "::notice::$wk is already present in this archive; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    # `always()` so a precheck that errors outright does not skip the archive:
    # only an explicit `false` gates the run. The precheck is an optimisation,
    # never a dependency.
    if: always() && needs.precheck.outputs.proceed != 'false'
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: usdm-counties-reported
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript usdm-counties-reported.R

      # Commit the freshly rendered README (and only it) back to git.
      # README.md text changes only when the data change, so no-op runs
      # skip the commit; PNG byte-noise alone never triggers one.
      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged; skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md example-1.png
          git commit -m 'Weekly README render'
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::notice::README render superseded by a concurrent run; skipping commit."
            exit 0
          fi
          git push
